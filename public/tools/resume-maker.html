<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Maker — 1 Minute me CV | ProTools</title>
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{
  background: #0a0e17;
  background-image: radial-gradient(ellipse at 30% 10%, rgba(124,58,237,0.15) 0%, transparent 50%),
                    radial-gradient(ellipse at 70% 90%, rgba(245,179,1,0.08) 0%, transparent 50%);
  background-attachment: fixed;
}
@media print{ .no-print{display:none!important} #resumePaper{box-shadow:none!important;margin:0!important} body{background:#fff} }
#resumePaper{background:#fff;color:#1a1a1a}
</style>
</head>
<body class="text-white min-h-screen">
<div class="max-w-md mx-auto px-4 py-6 pb-24">

<div class="flex items-center gap-2 mb-4 no-print">
<a href="/app/" class="text-purple-400">← Back</a>
<h1 class="text-xl font-extrabold ml-2">📝 AI Resume Maker</h1>
</div>
<p class="text-xs text-gray-400 mb-4 no-print">Professional resume in 1 minute — student friendly, completely free!</p>

<!-- Form -->
<div id="formBox" class="no-print space-y-2 mb-4">
<input id="rName" placeholder="Full name *" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-purple-500/60 focus:bg-white/8 transition-all placeholder:text-gray-500">
<input id="rPhone" placeholder="Mobile number *" maxlength="10" inputmode="numeric" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-purple-500/60 focus:bg-white/8 transition-all placeholder:text-gray-500">
<input id="rEmail" placeholder="Email" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-purple-500/60 focus:bg-white/8 transition-all placeholder:text-gray-500">
<input id="rEdu" placeholder="Education (e.g. B.A. 2nd Year, MGKVP Varanasi) *" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-purple-500/60 focus:bg-white/8 transition-all placeholder:text-gray-500">
<input id="rSkills" placeholder="Skills (comma separated: MS Word, Typing, Hindi) *" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-purple-500/60 focus:bg-white/8 transition-all placeholder:text-gray-500">
<textarea id="rExp" placeholder="Experience / Projects (optional)" rows="2" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-purple-500/60 focus:bg-white/8 transition-all placeholder:text-gray-500"></textarea>
<button id="genBtn" class="w-full font-extrabold py-4 rounded-2xl text-white relative overflow-hidden transition-transform active:scale-[0.98]"
      style="background:linear-gradient(180deg,#a855f7 0%,#7c3aed 50%,#6d28d9 100%);
             box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 -2px 0 rgba(0,0,0,0.2) inset, 0 8px 24px rgba(124,58,237,0.4);">
      <span class="relative z-10">✨ Generate My Resume</span>
    </button>
</div>

<!-- Preview -->
<div id="previewBox" class="hidden mb-4">
<div id="resumePaper" class="rounded-2xl p-8 shadow-2xl text-sm relative overflow-hidden" style="box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(124,58,237,0.2);">
<div class="text-center border-b-2 border-purple-700 pb-3 mb-3">
<h2 id="pName" class="text-2xl font-extrabold text-purple-800"></h2>
<p id="pContact" class="text-gray-600 text-xs mt-1"></p>
</div>
<h3 class="font-bold text-purple-700 mb-1">🎓 EDUCATION</h3>
<p id="pEdu" class="mb-3 text-gray-800"></p>
<h3 class="font-bold text-purple-700 mb-1">⚡ SKILLS</h3>
<p id="pSkills" class="mb-3 text-gray-800"></p>
<div id="expWrap"><h3 class="font-bold text-purple-700 mb-1">💼 EXPERIENCE / PROJECTS</h3>
<p id="pExp" class="mb-3 text-gray-800"></p></div>
<p class="text-center text-[10px] text-gray-400 mt-4">Made with ProTools • rps-world-website.onrender.com</p>
</div>
<button id="dlBtn" class="no-print w-full font-extrabold py-4 rounded-2xl mt-3 transition-transform active:scale-[0.98]"
      style="background:linear-gradient(180deg,#ffd54a 0%,#f5b301 50%,#d49400 100%);color:#1a1000;
             box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 -2px 0 rgba(0,0,0,0.2) inset, 0 8px 24px rgba(245,179,1,0.35);">
      ⬇️ Download Resume (PDF)
    </button>
</div>

<!-- Rewarded gate modal -->
<div id="adModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 no-print">
<div class="bg-[#1e1e2e] rounded-2xl p-5 w-full max-w-sm text-center">
<p class="text-xs text-gray-400 mb-1">SPONSORED</p>
<div class="mb-3" hidden><!-- AdSense slot: unhide when client ID configured --></div>
<p class="font-bold mb-1">⏳ <span id="adTimer">30</span> seconds...</p>
<p class="text-xs text-gray-400 mb-3">Sponsor dekhne ke baad download unlock hoga</p>
<button id="adDone" disabled class="w-full font-extrabold py-2.5 rounded-xl bg-gray-700 text-gray-400">Wait karo...</button>
</div>
</div>

</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}
document.getElementById('genBtn').onclick = () => {
  const n = rName.value.trim(), p = rPhone.value.trim();
  if(n.length < 2){alert('Naam likho');return;}
  if(!/^[6-9]\d{9}$/.test(p)){alert('Sahi 10-digit mobile number dalo');return;}
  if(!rEdu.value.trim() || !rSkills.value.trim()){alert('Education aur Skills bharo');return;}
  pName.textContent = n;
  pContact.textContent = '📱 ' + p + (rEmail.value.trim() ? '  •  ✉️ ' + rEmail.value.trim() : '');
  pEdu.textContent = rEdu.value.trim();
  pSkills.textContent = rSkills.value.trim().split(',').map(s=>s.trim()).filter(Boolean).join(' • ');
  if(rExp.value.trim()){ pExp.textContent = rExp.value.trim(); expWrap.style.display='block'; }
  else expWrap.style.display='none';
  formBox.style.display='none'; previewBox.classList.remove('hidden');
  previewBox.scrollIntoView({behavior:'smooth'});
};
document.getElementById('dlBtn').onclick = () => {
  adModal.classList.remove('hidden');
  let t = 30; const timer = document.getElementById('adTimer'), done = document.getElementById('adDone');
  done.disabled = true; done.className = 'w-full font-extrabold py-2.5 rounded-xl bg-gray-700 text-gray-400'; done.textContent = 'Wait karo...';
  const iv = setInterval(() => {
    t--; timer.textContent = t;
    if(t <= 0){ clearInterval(iv); done.disabled = false;
      done.className = 'w-full font-extrabold py-2.5 rounded-xl'; done.style.background='linear-gradient(135deg,#22c55e,#16a34a)'; done.style.color='#fff';
      done.textContent = '✅ Download Karo'; }
  }, 1000);
  done.onclick = () => { if(!done.disabled){ adModal.classList.add('hidden'); window.print(); } };
};
</script>
</body>
</html>
