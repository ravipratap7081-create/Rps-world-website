<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Sarkari Scheme Finder — Which Scheme Qualifies? | ProTools</title>
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#12121f}</style>
</head>
<body class="text-white min-h-screen">
<div class="max-w-md mx-auto px-4 py-6 pb-24">

<div class="flex items-center gap-2 mb-4">
<a href="/app/" class="text-purple-400">← Back</a>
<h1 class="text-xl font-extrabold ml-2">🏛️ Scheme Finder</h1>
</div>
<p class="text-xs text-gray-400 mb-4">Enter your details — AI will tell you which <b class="text-yellow-400">government schemes/scholarships</b> you qualify for!</p>

<div id="formBox" class="space-y-2 mb-4">
<div class="grid grid-cols-2 gap-2">
<input id="sAge" type="number" placeholder="Age *" inputmode="numeric" class="bg-[#1e1e2e] rounded-xl px-3 py-2.5 text-sm outline-none">
<select id="sGender" class="bg-[#1e1e2e] rounded-xl px-3 py-2.5 text-sm outline-none">
<option value="">Gender *</option><option>Male</option><option>Female</option><option>Other</option></select>
</div>
<select id="sCat" class="w-full bg-[#1e1e2e] rounded-xl px-3 py-2.5 text-sm outline-none">
<option value="">Category *</option><option>SC</option><option>ST</option><option>OBC</option><option>General</option><option>EWS</option></select>
<select id="sIncome" class="w-full bg-[#1e1e2e] rounded-xl px-3 py-2.5 text-sm outline-none">
<option value="">Family yearly income *</option><option value="1">₹2 Lakh se kam</option><option value="2">₹2–5 Lakh</option><option value="3">More than ₹5 Lakh</option></select>
<select id="sOcc" class="w-full bg-[#1e1e2e] rounded-xl px-3 py-2.5 text-sm outline-none">
<option value="">Aap kya karte ho? *</option><option value="student">Student</option><option value="farmer">Kisaan</option><option value="business">Business/Self-employed</option><option value="job">Naukri</option><option value="unemployed">Unemployed</option></select>
<input id="sPhone" placeholder="Mobile number (result WhatsApp par bhi) *" maxlength="10" inputmode="numeric" class="w-full bg-[#1e1e2e] rounded-xl px-3 py-2.5 text-sm outline-none">
<button id="findBtn" class="w-full font-extrabold py-3 rounded-xl" style="background:linear-gradient(135deg,#7c3aed,#a855f7)">🔍 View My Schemes</button>
</div>

<div id="resultBox" class="hidden space-y-3"></div>

</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}
const SCHEMES = [
 {n:"PM-KISAN Samman Nidhi", d:"Kisaanon ko ₹6,000/saal (3 kishton me)", ok:o=>o==='farmer', link:"pmkisan.gov.in"},
 {n:"UP Scholarship (Dashmottar)", d:"UP ke students ko fees + maintenance", ok:(o,a,c)=>o==='student'&&a>=14, link:"scholarship.up.gov.in"},
 {n:"Sukanya Samriddhi Yojana", d:"7.6% interest savings for daughters", ok:(o,a,g)=>g==='Female'&&a<10, link:"nsiindia.gov.in"},
 {n:"Kanya Sumangala Yojana (UP)", d:"₹15,000 for UP daughters (6 installments)", ok:(o,a,g)=>g==='Female', link:"mksy.up.gov.in"},
 {n:"Ayushman Bharat (PM-JAY)", d:"₹5 Lakh tak free ilaj", ok:(o,a,c,i)=>i==="1", link:"beneficiary.nha.gov.in"},
 {n:"PM Mudra Yojana", d:"Up to ₹10 Lakh loan for business", ok:o=>o==='business'||o==='unemployed', link:"mudra.org.in"},
 {n:"PM Awas Yojana", d:"Subsidy for building a home", ok:(o,a,c,i)=>i==="1"||i==="2", link:"pmaymis.gov.in"},
 {n:"PM Vishwakarma", d:"Karigaron ko training + ₹15,000 toolkit", ok:o=>o==='business', link:"pmvishwakarma.gov.in"},
 {n:"Pre-Matric Scholarship (SC/ST)", d:"Class 9-10 ke SC/ST students ke liye", ok:(o,a,c)=>o==='student'&&(c==='SC'||c==='ST'), link:"scholarships.gov.in"},
 {n:"National Scholarship Portal", d:"50+ scholarships ek jagah", ok:o=>o==='student', link:"scholarships.gov.in"},
];
document.getElementById('findBtn').onclick = async () => {
  const age = parseInt(sAge.value), g = sGender.value, c = sCat.value, i = sIncome.value, o = sOcc.value, ph = sPhone.value.trim();
  if(!age || !g || !c || !i || !o){alert('Saari * wali details bharo');return;}
  if(!/^[6-9]\d{9}$/.test(ph)){alert('Sahi 10-digit mobile number dalo');return;}
  const matched = SCHEMES.filter(s => { try{ return s.ok(o, age, g, c, i); }catch(e){ return false; } });
  const box = document.getElementById('resultBox'); box.classList.remove('hidden'); box.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'rounded-2xl p-4'; head.style.background = 'linear-gradient(135deg,#166534,#22c55e)';
  head.innerHTML = '<p class="font-extrabold">🎉 You qualify for ' + matched.length + ' schemes!</p><p class="text-xs opacity-80">See the list below — with apply links</p>';
  box.appendChild(head);
  matched.forEach(s => {
    const d = document.createElement('div');
    d.className = 'bg-[#1e1e2e] rounded-2xl p-4';
    d.innerHTML = '<p class="font-bold text-yellow-400">✅ ' + s.n + '</p><p class="text-xs text-gray-300 mt-1">' + s.d + '</p><a href="https://' + s.link + '" target="_blank" class="text-xs text-purple-400 underline">🔗 ' + s.link + ' par apply karo</a>';
    box.appendChild(d);
  });
  // AI summary
  const ai = document.createElement('div');
  ai.className = 'bg-[#1e1e2e] rounded-2xl p-4'; ai.innerHTML = '<p class="text-xs text-gray-400">🤖 AI salah de raha hai...</p>';
  box.appendChild(ai);
  try{
    const q = encodeURIComponent('Ek ' + age + ' saal ke ' + g + ' ' + o + ' (' + c + ' category, UP) ke liye sarkari yojanaon me apply karne ki 3 short tips Hindi me do:');
    const r = await fetch('https://text.pollinations.ai/' + q); const t = await r.text();
    ai.innerHTML = '<p class="font-bold text-teal-300 text-sm mb-1">🤖 AI Salah:</p><p class="text-xs text-gray-300">' + t.slice(0,600).replace(/\n/g,'<br>') + '</p>';
  }catch(e){ ai.innerHTML = '<p class="text-xs text-gray-500">AI salah abhi available nahi — upar wali list se apply karo!</p>'; }
  // Lead → WhatsApp (CRM me bhi jayega jab backend ready)
  const msg = encodeURIComponent('🔔 Scheme Lead\nAge: ' + age + '\nGender: ' + g + '\nCat: ' + c + '\nWork: ' + o + '\nPhone: ' + ph + '\nMatched: ' + matched.length + ' schemes');
  const wa = document.createElement('a');
  wa.href = 'https://wa.me/919235039317?text=' + msg; wa.target = '_blank';
  wa.className = 'block text-center font-extrabold py-3 rounded-xl'; wa.style.background = 'linear-gradient(135deg,#FFD700,#FF8C00)'; wa.style.color = '#1A1A2E';
  wa.textContent = '📲 Expert se baat karo (WhatsApp)';
  box.appendChild(wa);
  try{ // real lead → Supabase (insert-only, anon)
    if(window.trackLead) window.trackLead('Scheme User', ph, 'Scheme', {age, gender:g, cat:c, occ:o, matched: matched.length});
  }catch(e){}
  box.scrollIntoView({behavior:'smooth'});
};
</script>
</body>
</html>
